apiVersion: apps/v1
kind: Deployment
metadata:
  name: leverage-analyzer
  labels:
    app: leverage-analyzer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: leverage-analyzer
  template:
    metadata:
      labels:
        app: leverage-analyzer
    spec:
      containers:
      - name: leverage-analyzer
        image: leverage-analyzer:latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_APP
          value: "main.py"
        - name: FLASK_ENV
          value: "production"
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.5"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /test
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /test
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
