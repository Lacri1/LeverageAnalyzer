<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TQQQ 레버리지 분석기</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@4.1.0/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@latest/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>TQQQ 레버리지 분석기</h1>
        <div class="info-text">
            이 도구는 QQQ와 TQQQ의 성과를 비교하고 레버리지 효과를 분석합니다.<br>
            QQQ 시작일: 1999년 3월 10일, TQQQ 시작일: 2010년 2월 11일<br>
            QQQ 시작일 이전 조회는 지원하지 않으며 TQQQ 시작일 이전에는 예측만 출력합니다
        </div>
    </div>

    <div class="content">
        <div class="control-panel">
            <div class="date-selector">
                <div class="date-group">
                    <label for="start-date">시작일:</label>
                    <input type="date" id="start-date" name="start-date">
                </div>
                <div class="date-group">
                    <label for="end-date">종료일:</label>
                    <input type="date" id="end-date" name="end-date">
                </div>
                <button type="submit" id="analyze-btn" class="analyze-btn">분석 시작</button>
            </div>
        </div>
        <div class="chart-section">
            <div class="chart-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 class="chart-title" style="margin: 0;">TQQQ 누적 수익 비교</h2>
                <div class="chart-controls" style="margin-left: 20px;">
                    <button id="toggleQQQ" class="toggle-btn active" data-visible="true" style="
                        padding: 8px 16px;
                        border: 1px solid #4f46e5;
                        border-radius: 6px;
                        background: #4f46e5;
                        color: white;
                        cursor: pointer;
                        font-size: 14px;
                        font-weight: 500;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                        transition: all 0.2s ease;
                    ">
                        <span class="toggle-text">QQQ 수익률 표시</span>
                    </button>
                </div>
            </div>
            <div class="chart-container" style="position: relative; height: 70vh; width: 100%;">
                <canvas id="leverageChart"></canvas>
            </div>
        </div>
    </div>
</div></body>

<script>

    // 상수 정의
    const QQQ_START_DATE = new Date('1999-03-10T00:00:00+09:00');
    const TQQQ_START_DATE = new Date('2010-02-11T00:00:00+09:00');
    
    // 요청 캐싱을 위한 변수
    const requestCache = new Map();
    const CACHE_DURATION = 30000; // 30초 동안 캐시 유지
    
    // 요청이 캐시되었는지 확인하는 함수
    function isRequestCached(startDate, endDate) {
        const cacheKey = `${startDate}-${endDate}`;
        const cached = requestCache.get(cacheKey);
        if (!cached) return false;
        
        // 캐시 유효 시간 확인 (30초)
        const now = Date.now();
        if (now - cached.timestamp > CACHE_DURATION) {
            requestCache.delete(cacheKey);
            return false;
        }
        return true;
    }
    
    // 요청을 캐시에 저장하는 함수
    function cacheRequest(startDate, endDate) {
        const cacheKey = `${startDate}-${endDate}`;
        requestCache.set(cacheKey, {
            timestamp: Date.now()
        });
    }

    // 날짜 포맷팅 함수 (YYYY-MM-DD)
    function formatDateForInput(date) {
        // 이미 YYYY-MM-DD 형식인 경우 그대로 반환
        if (typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
            return date;
        }
        if (!(date instanceof Date) || isNaN(date.getTime())) {
            console.error('Invalid date object:', date);
            return '';
        }
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // 한국 시간대 날짜 가져오기
    function getKoreaDate() {
        const now = new Date();
        // 한국 시간대(UTC+9)로 조정
        const koreaTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 60 * 60000));
        return koreaTime;
    }

    // 날짜 유효성 검사 함수
    function validateDateRange(startDate, endDate) {
        const qqqStart = new Date('1999-03-10T00:00:00+09:00');
        const tqqqStart = new Date('2010-02-11T00:00:00+09:00');
        
        const start = new Date(startDate + 'T00:00:00+09:00');
        const end = new Date(endDate + 'T23:59:59+09:00');
        
        if (isNaN(start.getTime()) || isNaN(end.getTime())) {
            throw new Error('유효한 날짜 형식이 아닙니다. (YYYY-MM-DD)');
        }
        
        if (start < qqqStart) {
            throw new Error(`시작일은 ${formatDate(qqqStart)} 이후로 설정해주세요.`);
        }
        
        if (end > new Date()) {
            throw new Error('종료일은 오늘 이전이어야 합니다.');
        }
        
        if (start > end) {
            throw new Error('종료일은 시작일 이후여야 합니다.');
        }
        
        return { start, end };
    }

    // API 요청하여 데이터 가져오기
    async function fetchLeverageData() {
        // Prevent duplicate requests
        const startDateInput = document.getElementById('start-date');
        const endDateInput = document.getElementById('end-date');
        if (!startDateInput || !endDateInput) {
            throw new Error('날짜 입력 요소를 찾을 수 없습니다.');
        }

        const startDate = startDateInput.value.trim();
        const endDate = endDateInput.value.trim();

        // 날짜 유효성 검사
        const dateRange = validateDateRange(startDate, endDate);
        
        if (isRequestCached(startDate, endDate)) {
            console.log('Request already in progress, skipping...');
            return;
        }

        console.log('fetchLeverageData called');
        cacheRequest(startDate, endDate);

        try {
            // 입력 요소 가져오기
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            const analyzeBtn = document.getElementById('analyze-btn');
            const dateRangeInfo = document.getElementById('date-range-info');

            if (!startDateInput || !endDateInput || !analyzeBtn) {
                throw new Error('필수 요소를 찾을 수 없습니다.');
            }

            const startDate = startDateInput.value.trim();
            const endDate = endDateInput.value.trim();

            console.log('Fetching data for date range:', { startDate, endDate });

            // 날짜 유효성 검사
            if (!startDate || !endDate) {
                throw new Error('시작일과 종료일을 모두 선택해주세요.');
            }

            // 날짜 유효성 검사 (이미 위에서 검사했으므로 여기서는 단순 대입만)

            // 버튼 비활성화 및 로딩 표시
            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<span class="loading"></span>분석 중';

            // 날짜 범위 정보 표시
            if (dateRangeInfo) {
                dateRangeInfo.textContent = `분석 기간: ${formatDate(startDate)} ~ ${formatDate(endDate)}`;
                dateRangeInfo.style.display = 'block';
            }

            // API 요청
            const url = `/api/analyze?start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}`;
            console.log('Making API request to:', url);

            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });

            console.log('API response status:', response.status);

            if (!response.ok) {
                let errorMessage = `서버 오류 (${response.status})`;
                try {
                    const errorData = await response.json();
                    if (errorData && errorData.error) {
                        errorMessage = errorData.error;
                    } else {
                        errorMessage = await response.text();
                    }
                } catch (e) {
                    errorMessage = `서버 응답을 처리할 수 없습니다. (${response.status})`;
                }
                throw new Error(errorMessage);
            }

            const data = await response.json();
            console.log('API response data:', data);

            // 차트 및 정보 업데이트
            updateChart(data);
            updateLeverageInfo(data);

        } catch (error) {
            console.error('API 요청 오류:', error);
            alert(`오류 발생: ${error.message || '알 수 없는 오류가 발생했습니다.'}`);

            // 오류 메시지 표시
            const errorInfo = document.getElementById('error-info');
            if (errorInfo) {
                errorInfo.textContent = `오류: ${error.message || '알 수 없는 오류'}`;
                errorInfo.style.display = 'block';

                // 5초 후 오류 메시지 숨기기
                setTimeout(() => {
                    if (errorInfo) errorInfo.style.display = 'none';
                }, 5000);
            }

            throw error; // 상위 핸들러에서 추가 처리를 위해 다시 throw
        } finally {
            // 버튼 상태 복원
            const analyzeBtn = document.getElementById('analyze-btn');
            if (analyzeBtn) {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = '분석하기';
            }
        }
    }

    // 데이터를 100으로 정규화하는 함수
    function normalizeToHundred(data) {
        if (!data || data.length === 0) return [];
        const firstValue = data[0];
        if (firstValue === 0) return data; // 0으로 나누기 방지
        return data.map(value => (value / firstValue) * 100);
    }

    // 데이터 샘플링 함수 (대규모 데이터셋 성능 최적화)
    function sampleData(dates, values, maxPoints = 500) {
        if (dates.length <= maxPoints) {
            return { dates, values };
        }

        const step = Math.ceil(dates.length / maxPoints);
        const sampledDates = [];
        const sampledValues = [];

        for (let i = 0; i < dates.length; i += step) {
            sampledDates.push(dates[i]);
            sampledValues.push(values[i]);
        }

        // 마지막 데이터 포인트는 항상 포함
        if (sampledDates[sampledDates.length - 1] !== dates[dates.length - 1]) {
            sampledDates.push(dates[dates.length - 1]);
            sampledValues.push(values[values.length - 1]);
        }

        console.log(`Sampled data from ${dates.length} to ${sampledDates.length} points`);
        return { dates: sampledDates, values: sampledValues };
    }

        // 차트 업데이트
    function updateChart(data) {
        if (!data) {
            console.error('No data provided to updateChart');
            return;
        }

        console.log('Updating chart with data:', data);

        const chartElement = document.getElementById('leverageChart');
        if (!chartElement) {
            console.error('Chart element not found');
            return;
        }

        const ctx = chartElement.getContext('2d');
        if (!ctx) {
            console.error('Could not get 2D context');
            return;
        }

        // QQQ 및 TQQQ 시작일 설정 (상수)
        const QQQ_CHART_START_DATE = new Date('1999-03-10T00:00:00+09:00');
        const TQQQ_CHART_START_DATE = new Date('2010-02-11T00:00:00+09:00');

        // 사용자가 선택한 시작일 가져오기
        const userSelectedStartDate = new Date(document.getElementById('start-date').value + 'T00:00:00+09:00');

        // 기존 차트가 있으면 제거 (안전하게 체크)
        if (window.leverageChart) {
            try {
                if (typeof window.leverageChart.destroy === 'function') {
                    window.leverageChart.destroy();
                }
            } catch (e) {
                console.warn('Error destroying previous chart:', e);
            } finally {
                window.leverageChart = null;
            }
        }

        // 데이터 유효성 검사
        if (!data.dates || !data.cumulative_actual || !data.cumulative_predicted || !data.cumulative_qqq) {
            console.error('필수 데이터가 누락되었습니다.', {
                dates: !!data.dates,
                actual: !!data.cumulative_actual,
                predicted: !!data.cumulative_predicted,
                qqq: !!data.cumulative_qqq
            });
            return;
        }

        // 데이터 가져오기 (API 응답에서 직접 사용)
        const dates = data.dates;
        const actualReturns = data.cumulative_actual;
        const predictedReturns = data.cumulative_predicted;
        const qqqCumulative = data.cumulative_qqq;

        console.log('API 응답 데이터 준비 완료. 샘플링 시작.');

        // 대규모 데이터셋 샘플링 (성능 최적화)
        const maxPoints = 200; // 최대 200개 포인트로 제한
        const step = Math.max(1, Math.ceil(dates.length / maxPoints));

        const sampledDates = [];
        const sampledActualReturns = [];
        const sampledPredictedReturns = [];
        const sampledQQQCumulative = [];

        for (let i = 0; i < dates.length; i += step) {
            sampledDates.push(dates[i]);
            sampledActualReturns.push(actualReturns[i]);
            sampledPredictedReturns.push(predictedReturns[i]);
            sampledQQQCumulative.push(qqqCumulative[i]);
        }

        // 마지막 데이터 포인트는 항상 포함 (누락될 수 있는 경우)
        if (sampledDates[sampledDates.length - 1] !== dates[dates.length - 1]) {
            sampledDates.push(dates[dates.length - 1]);
            sampledActualReturns.push(actualReturns[actualReturns.length - 1]);
            sampledPredictedReturns.push(predictedReturns[predictedReturns.length - 1]);
            sampledQQQCumulative.push(qqqCumulative[qqqCumulative.length - 1]);
        }

        console.log(`Sampled data from ${dates.length} to ${sampledDates.length} points`);

        const finalFilteredDates = sampledDates;
        const finalActualReturns = sampledActualReturns;
        const finalPredictedReturns = sampledPredictedReturns;
        const finalQQQCumulative = sampledQQQCumulative;

        console.log('Filtered data range:', {
            startDate: finalFilteredDates[0] || 'N/A',
            endDate: finalFilteredDates[finalFilteredDates.length - 1] || 'N/A',
            dataPoints: finalFilteredDates.length
        });

        // y축 범위 계산을 위한 모든 데이터 포인트 (QQQ 누적 수익률 포함)
        const allDataPoints = [
            ...(finalActualReturns || []).filter(value => value !== null && value !== undefined),
            ...(finalPredictedReturns || []).filter(value => value !== null && value !== undefined),
            ...(finalQQQCumulative || []).filter(value => value !== null && value !== undefined)
        ].filter(value => !isNaN(parseFloat(value)));

        // 데이터가 없을 경우 기본값 설정
        if (!allDataPoints.length) {
            allDataPoints.push(100);
        }
        
        const minValue = Math.min(...allDataPoints);
        const maxValue = Math.max(...allDataPoints);
        const range = maxValue - minValue || 20; // range가 0이면 20으로 설정
        const padding = Math.max(5, range * 0.1); // 최소 5% 여유

        // 애니메이션 설정 (더 부드러운 애니메이션을 위해 조정)
        const animationDuration = 1200; // 애니메이션 지속 시간 (밀리초)
        const easing = 'easeInOutCubic'; // 더 부드러운 이징 함수

        // Create chart configuration
        const chartConfig = {
            type: 'line',
            data: {
                labels: finalFilteredDates,
                datasets: [
                    {
                        label: '예측 TQQQ 수익률',
                        data: finalPredictedReturns,
                        borderColor: '#3b82f6',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: {
                        top: 10,
                        bottom: 20
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        align: 'start',
                        labels: {
                            boxWidth: 12,
                            padding: 15,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            filter: function(legendItem) {
                                // 실제 TQQQ 수익률은 사용자가 선택한 시작일이 TQQQ 상장일 이전이면 레전드에서 제외
                                if (legendItem.text === '실제 TQQQ 수익률' && userSelectedStartDate < TQQQ_CHART_START_DATE) {
                                    return false;
                                }
                                return true;
                            }
                        }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.y !== null) {
                                    label += context.parsed.y.toFixed(2) + '%';
                                }
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            unit: 'month',
                            tooltipFormat: 'yyyy-MM-dd',
                            displayFormats: {
                                day: 'MMM d',
                                week: 'MMM d',
                                month: 'MMM yyyy',
                                quarter: 'MMM yyyy',
                                year: 'yyyy'
                            }
                        },
                        grid: {
                            display: false
                        },
                        ticks: {
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value) {
                                return value + '%';
                            }
                        },
                        grid: {
                            display: true
                        }
                    }
                },
                animation: {
                    duration: animationDuration,
                    easing: easing
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                }
            }
        };

        // Add Actual TQQQ dataset if applicable
        if (userSelectedStartDate >= TQQQ_CHART_START_DATE) {
            chartConfig.data.datasets.unshift({ // Add to the beginning to appear first in legend
                label: '실제 TQQQ 수익률',
                data: finalActualReturns,
                borderColor: '#ef4444',
                backgroundColor: 'transparent',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.4
            });
        }

        // Add QQQ dataset to the chart data if it exists
        if (finalQQQCumulative) {
            chartConfig.data.datasets.push({
                label: 'QQQ 누적 수익률',
                data: finalQQQCumulative,
                borderColor: '#10b981',
                backgroundColor: 'transparent',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.4
            });
        }

        // Create and store the chart instance
        try {
            window.leverageChart = new Chart(ctx, chartConfig);
            console.log('Chart created successfully');
        } catch (error) {
            console.error('Error creating chart:', error);
            // Add error display to the UI
            const errorElement = document.createElement('div');
            errorElement.style.color = 'red';
            errorElement.style.padding = '10px';
            errorElement.textContent = '차트를 생성하는 중 오류가 발생했습니다: ' + error.message;
            chartElement.parentNode.insertBefore(errorElement, chartElement.nextSibling);
        }
    }

    // 날짜 포맷팅 함수
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        try {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('ko-KR', options);
        } catch (e) {
            console.error('Error formatting date:', e);
            return dateString; // Return original string if date parsing fails
        }
    }

    // 레버리지 정보 업데이트 함수
    function updateLeverageInfo(data) {
        if (!data) return;
        
        // 레버리지 정보가 있는 경우에만 업데이트
        if (data.leverage_info) {
            const infoElement = document.getElementById('leverage-info');
            if (infoElement) {
                const avgLeverage = data.leverage_info.average_leverage;
                infoElement.textContent = '평균 레버리지: ' + 
                    (avgLeverage ? avgLeverage.toFixed(2) : 'N/A');
            }
        }
        
        // 날짜 범위 정보 업데이트 (API 응답에 날짜가 있는 경우)
        const dateInfoElement = document.getElementById('date-range-info');
        if (dateInfoElement && data.dates && data.dates.length > 0) {
            // 날짜 정보 업데이트 로직
            // ...
        }
    }

    // Debouncing function implementation
    function debounce(func, wait) {
        let timeout;
        return function executedFunction() {
            const context = this;
            const args = arguments;
            clearTimeout(timeout);
            timeout = setTimeout(function() {
                func.apply(context, args);
            }, wait);
        };
    }

    // 초기화 코드
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            const today = getKoreaDate();
            const qqqStartDate = new Date('1999-03-10T00:00:00+09:00');
            
            // 6개월 전 날짜 계산 (기본 시작일로 사용)
            const sixMonthsAgo = new Date(today);
            sixMonthsAgo.setMonth(today.getMonth() - 6);
            
            // 시작일과 종료일 입력 필드 가져오기
            const startDateInput = document.getElementById('start-date');
            const endDateInput = document.getElementById('end-date');
            
            // 날짜 입력 필드의 최소/최대값 설정
            startDateInput.min = '1999-03-10';
            startDateInput.max = formatDateForInput(today);
            endDateInput.min = '1999-03-10';
            endDateInput.max = formatDateForInput(today);
            
            // 기본값 설정 (6개월 전부터 어제까지)
            const defaultStartDate = sixMonthsAgo < qqqStartDate ? qqqStartDate : sixMonthsAgo;
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            
            startDateInput.value = formatDateForInput(defaultStartDate);
            endDateInput.value = formatDateForInput(yesterday);
            
            // 시작일이 변경되면 종료일의 최소값 업데이트
            startDateInput.addEventListener('change', function() {
                endDateInput.min = this.value;
                if (new Date(endDateInput.value) < new Date(this.value)) {
                    endDateInput.value = this.value;
                }
            });
            
            // 종료일이 변경되면 시작일의 최대값 업데이트
            endDateInput.addEventListener('change', function() {
                startDateInput.max = this.value;
                if (new Date(startDateInput.value) > new Date(this.value)) {
                    startDateInput.value = this.value;
                }
            });
            
            // 페이지 로드 시 자동으로 데이터 가져오기
            try {
                console.log('Loading initial data...');
                await fetchLeverageData();
            } catch (error) {
                console.error('Error loading initial data:', error);
            }
            
            // 폼 제출 이벤트 리스너 추가
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    try {
                        await fetchLeverageData();
                    } catch (error) {
                        console.error('Error in form submission:', error);
                    }
                });
            }
            
            // 분석하기 버튼 클릭 이벤트 리스너 추가 (폼이 없는 경우 대비)
            const analyzeBtn = document.getElementById('analyze-btn');
            if (analyzeBtn) {
                analyzeBtn.addEventListener('click', async function() {
                    try {
                        await fetchLeverageData();
                    } catch (error) {
                        console.error('Error in analyze button click:', error);
                    }
                });
            }
            
            console.log('Initialization complete');
        } catch (error) {
            console.error('Initialization error:', error);
        }
    });
</script>

</html>
